<title>Connector Atlas v5 — composition engine</title>
<style>
:root{
  --cin:#E64A2E; --cin-glow:#FF6B4A; --cin-deep:#A83318; --jade:#35A481;
  --ink:#0E0C0B; --surface:#171310; --paper:#F4EFE8; --mut:#8A7F76;
  --line:rgba(244,239,232,.09); --glass:rgba(23,19,16,.62);
  --gold:#C9B458; --amber:#E08A3C; --slate:#7D9BD2;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:13px;
  -webkit-font-smoothing:antialiased}
h1,h2{text-wrap:balance}
.kv span:last-child,.bar .lb b,.row .ct{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--cin-glow);outline-offset:2px;border-radius:6px}
/* This page deliberately commits to one visual world: luminous edges on dark ground is
   what keeps 1,610 overlapping arcs legible. A light theme would erase the signal, so
   the single theme is a design decision, not an omission. */
@media (prefers-reduced-motion:reduce){
  .orb{animation:none}
  *{transition-duration:.01ms !important}
}

/* living background */
#orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
.o1{width:46vw;height:46vw;top:-14%;left:-10%;
  background:radial-gradient(circle,rgba(230,74,46,.18),transparent 70%);
  animation:dr1 42s ease-in-out infinite alternate}
.o2{width:40vw;height:40vw;bottom:-16%;right:-8%;
  background:radial-gradient(circle,rgba(53,164,129,.15),transparent 70%);
  animation:dr2 51s ease-in-out infinite alternate}
.o3{width:30vw;height:30vw;top:36%;left:54%;
  background:radial-gradient(circle,rgba(201,180,88,.09),transparent 70%);
  animation:dr3 61s ease-in-out infinite alternate}
@keyframes dr1{to{transform:translate(10vw,8vh) scale(1.18)}}
@keyframes dr2{to{transform:translate(-8vw,-9vh) scale(1.12)}}
@keyframes dr3{to{transform:translate(-12vw,6vh) scale(.9)}}

#cv{position:fixed;inset:0;z-index:1;cursor:grab;touch-action:none}
#cv.grabbing{cursor:grabbing}
#cv.pointing{cursor:pointer}

/* header */
.hud{position:fixed;top:22px;left:26px;z-index:6;pointer-events:none;max-width:420px}
.hud h1{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1.02;letter-spacing:.2px}
.hud h1 em{font-style:italic;color:var(--cin)}
.hud h1 .v{font-size:18px;color:var(--mut);font-style:italic;margin-left:5px}
.hud .stat{margin-top:8px;font-size:10.5px;letter-spacing:.5px;color:var(--mut)}
.hud .stat b{color:var(--jade);font-weight:500}

/* controls */
.ctl{position:fixed;top:22px;right:26px;z-index:8;display:flex;gap:7px;align-items:center;flex-wrap:wrap;
  justify-content:flex-end;max-width:52vw}
.ctl input,.ctl button{background:var(--glass);border:1px solid var(--line);color:var(--paper);
  font-family:var(--mono);font-size:11.5px;padding:8px 11px;border-radius:9px;outline:none;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.ctl input::placeholder{color:var(--mut)}
.ctl input:focus{border-color:rgba(230,74,46,.55)}
.ctl button{cursor:pointer;transition:.18s}
.ctl button:hover{border-color:var(--cin);color:var(--cin-glow)}
.ctl button.on{border-color:var(--jade);color:var(--jade)}

/* left rail */
#rail{position:fixed;left:26px;top:150px;bottom:96px;width:264px;z-index:6;display:flex;
  flex-direction:column;background:var(--glass);border:1px solid var(--line);border-radius:13px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:0 0 auto}
.tabs button{flex:1;background:none;border:none;color:var(--mut);font-family:var(--mono);
  font-size:10px;letter-spacing:1.3px;text-transform:uppercase;padding:11px 6px;cursor:pointer;
  transition:.18s;border-bottom:2px solid transparent}
.tabs button.on{color:var(--paper);border-bottom-color:var(--cin)}
.tabs button:hover{color:var(--paper)}
.rows{overflow-y:auto;padding:6px;flex:1 1 auto}
.rows::-webkit-scrollbar,#detail::-webkit-scrollbar{width:8px}
.rows::-webkit-scrollbar-thumb,#detail::-webkit-scrollbar-thumb{
  background:rgba(244,239,232,.14);border-radius:4px}
.row{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;cursor:pointer;
  font-size:11px;color:#C9C4B8;transition:.14s}
.row:hover{background:rgba(244,239,232,.06);color:var(--paper)}
.row .sw{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.row .nm{flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ct{color:var(--mut);font-size:10px}
.srow{padding:9px;border-radius:9px;cursor:pointer;margin-bottom:5px;
  border:1px solid transparent;transition:.16s}
.srow:hover{background:rgba(244,239,232,.05);border-color:var(--line)}
.srow.on{background:rgba(230,74,46,.1);border-color:rgba(230,74,46,.42)}
.srow .t{font-size:11.5px;color:var(--paper);line-height:1.3;margin-bottom:5px}
.srow .m{display:flex;gap:5px;align-items:center;font-size:9.5px;color:var(--mut)}
.tg{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:99px;
  border:1px solid var(--line);font-size:9px;letter-spacing:.4px}
.tg.S{color:var(--cin-glow);border-color:rgba(255,107,74,.5)}
.tg.A{color:var(--jade);border-color:rgba(53,164,129,.5)}
.tg.B{color:var(--gold);border-color:rgba(201,180,88,.45)}
.tg.C{color:var(--mut)}

/* detail */
#detail{position:fixed;right:26px;top:78px;width:392px;max-height:calc(100vh - 150px);z-index:7;
  background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:20px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);overflow-y:auto;
  opacity:0;transform:translateX(16px);pointer-events:none;transition:opacity .26s,transform .26s}
#detail.open{opacity:1;transform:none;pointer-events:auto}
.dx{position:absolute;top:11px;right:13px;background:none;border:none;color:var(--mut);
  font-size:19px;cursor:pointer;line-height:1;font-family:inherit;padding:2px 6px}
.dx:hover{color:var(--cin)}
.dk{font-size:9px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut);margin-bottom:7px}
#detail h2{font-family:var(--serif);font-weight:400;font-size:25px;line-height:1.14;
  margin-bottom:7px;padding-right:20px}
.tag{font-size:11.5px;line-height:1.55;color:#B9B4A8;margin-bottom:13px}
.sec{font-size:9px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut);margin:15px 0 7px;
  padding-top:11px;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:none;padding-top:0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;font-size:10.5px;
  border:1px solid var(--line);color:#C9C4B8;background:rgba(244,239,232,.03)}
.chip.em{color:#6FCEAC;border-color:rgba(53,164,129,.4);background:rgba(53,164,129,.08)}
.chip.co{color:#F0917C;border-color:rgba(230,74,46,.4);background:rgba(230,74,46,.08)}
.none{font-size:10.5px;color:var(--mut);font-style:italic}
.note{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-family:var(--serif);
  font-style:italic;font-size:13.5px;line-height:1.5;color:#A9A49A}
.warn{margin-top:12px;padding:10px 12px;border-radius:9px;font-size:11px;line-height:1.55;
  background:rgba(230,74,46,.09);border:1px solid rgba(230,74,46,.3);color:#F0A491}
.warn b{color:var(--cin-glow)}
/* score bars */
.bar{margin:7px 0}
.bar .lb{display:flex;justify-content:space-between;font-size:10px;color:var(--mut);margin-bottom:3px}
.bar .lb b{color:var(--paper);font-weight:500}
.bar .tr{height:4px;border-radius:3px;background:rgba(244,239,232,.08);overflow:hidden}
.bar .fl{height:100%;border-radius:3px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:11px;padding:4px 0;
  border-bottom:1px solid rgba(244,239,232,.05)}
.kv span:first-child{color:var(--mut)}
.kv span:last-child{color:var(--paper);text-align:right}
.blk{font-family:var(--mono);font-size:10.5px;line-height:1.7;background:rgba(0,0,0,.28);
  border:1px solid var(--line);border-radius:9px;padding:11px;white-space:pre-wrap;
  overflow-x:auto;color:#C9C4B8}
.blk .k{color:var(--jade)}
.blk .v{color:var(--paper)}
ol.plan{margin:0 0 0 15px;font-size:11px;line-height:1.65;color:#C9C4B8}
ol.plan li{margin-bottom:5px;padding-left:3px}
.ribs{font-size:10.5px}
.rib{display:flex;gap:7px;align-items:baseline;padding:5px 0;border-bottom:1px solid rgba(244,239,232,.05)}
.rib .p{color:var(--jade);flex:0 0 auto;font-size:9.5px}
.rib .n{flex:1 1 auto;color:#C9C4B8}
.rib .c{flex:0 0 auto;font-size:9px;letter-spacing:.4px}
.rib .c.ai{color:var(--cin-glow)}.rib .c.code{color:var(--mut)}

/* footer bits */
#sfx{position:fixed;left:26px;bottom:22px;z-index:6;display:flex;gap:12px;flex-wrap:wrap;
  padding:9px 14px;background:var(--glass);border:1px solid var(--line);border-radius:99px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.sfc{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;color:var(--mut)}
.sfc i{width:8px;height:8px;border-radius:50%}
#hint{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:5;
  font-size:9.5px;letter-spacing:.9px;color:var(--mut);text-align:center;pointer-events:none}
#zoom{position:fixed;right:26px;bottom:22px;z-index:6;display:flex;gap:6px}
#zoom button{width:33px;height:33px;border-radius:9px;background:var(--glass);
  border:1px solid var(--line);color:var(--paper);cursor:pointer;font-family:var(--mono);
  font-size:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#zoom button:hover{border-color:var(--cin);color:var(--cin-glow)}
#pathout{position:fixed;left:310px;right:440px;bottom:74px;z-index:7;background:var(--glass);
  border:1px solid var(--line);border-radius:12px;padding:12px 15px;font-size:11px;line-height:1.75;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:none;max-height:30vh;overflow:auto}
#pathout .hop{color:var(--jade)}#pathout .key{color:var(--cin-glow)}#pathout .warn2{color:var(--gold)}
#pathout b{color:var(--paper);font-weight:500}

@media(max-width:1100px){
  #rail{display:none} #pathout{left:26px;right:26px}
  #detail{left:16px;right:16px;width:auto;top:auto;bottom:70px;max-height:52vh}
  .ctl{max-width:60vw} #hint{display:none}
}
@media(max-width:640px){ .hud h1{font-size:29px} #sfx{display:none} }

/* ---- lab: the combinatorial views. Same visual world as the map -- glass on ink,
   cinnabar for emphasis, jade for measured-good, tabular numerals everywhere a
   number is meant to be compared down a column. ---- */
#lab{position:fixed;inset:0;z-index:20;background:rgba(14,12,11,.93);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:none;overflow-y:auto;overflow-x:hidden;padding:26px clamp(16px,4vw,54px) 70px}
#lab.open{display:block}
#lab h2{font-family:var(--serif);font-weight:400;font-size:clamp(26px,4vw,38px);line-height:1.05}
#lab h2 em{font-style:italic;color:var(--cin)}
#lab .sub{color:var(--mut);font-size:11.5px;margin-top:6px;max-width:70ch;line-height:1.65}
#lab .labx{position:fixed;top:22px;right:26px;z-index:22;background:var(--glass);
  border:1px solid var(--line);color:var(--paper);font-family:var(--mono);font-size:14px;
  width:34px;height:34px;border-radius:9px;cursor:pointer}
#lab .labtabs{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0 22px}
#lab .labtabs button{background:transparent;border:1px solid var(--line);color:var(--mut);
  font-family:var(--mono);font-size:11.5px;padding:8px 13px;border-radius:9px;cursor:pointer}
#lab .labtabs button.on{color:var(--paper);border-color:rgba(230,74,46,.55);
  background:rgba(230,74,46,.10)}
.lv{display:none}.lv.on{display:block}
.grid{display:grid;gap:13px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.card{background:rgba(244,239,232,.032);border:1px solid var(--line);border-radius:13px;padding:15px 17px}
.card .k{font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--mut)}
.card .n{font-family:var(--serif);font-size:31px;line-height:1.1;margin-top:5px;
  font-variant-numeric:tabular-nums}
.card .n.jade{color:var(--jade)} .card .n.cin{color:var(--cin)}
.card .d{font-size:10.5px;color:var(--mut);margin-top:6px;line-height:1.6}
.ltab{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:8px}
.ltab th{text-align:left;font-weight:500;color:var(--mut);font-size:9.5px;letter-spacing:.9px;
  text-transform:uppercase;padding:8px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
.ltab td{padding:8px 11px;border-bottom:1px solid rgba(244,239,232,.05);vertical-align:top}
.ltab td.num{text-align:right;font-variant-numeric:tabular-nums}
.ltab tr:hover td{background:rgba(244,239,232,.03)}
.scroll{overflow-x:auto;max-width:100%}
.tierb{font-size:9px;letter-spacing:.7px;padding:2px 6px;border-radius:5px;border:1px solid;
  text-transform:uppercase}
.tierb.VERIFIED{color:var(--jade);border-color:rgba(53,164,129,.5)}
.tierb.HARVESTED{color:var(--gold);border-color:rgba(201,180,88,.45)}
.tierb.DIRECTORY{color:var(--mut);border-color:var(--line)}
.authb{font-size:9px;letter-spacing:.7px;padding:2px 6px;border-radius:5px;
  color:var(--jade);border:1px solid rgba(53,164,129,.4)}
.pairbox{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  align-items:end;margin-bottom:16px}
.pairbox input{background:var(--glass);border:1px solid var(--line);color:var(--paper);
  font-family:var(--mono);font-size:12px;padding:10px 12px;border-radius:9px;width:100%}
.verdict{border:1px solid var(--line);border-radius:13px;padding:17px 19px;margin-top:6px;
  background:rgba(244,239,232,.032)}
.verdict .big{font-family:var(--serif);font-size:25px;line-height:1.15}
.verdict .big.yes{color:var(--jade)} .verdict .big.no{color:var(--cin)}
.verdict .why{color:var(--mut);font-size:11.5px;margin-top:8px;line-height:1.65}
.dbar{height:7px;border-radius:4px;background:rgba(244,239,232,.09);overflow:hidden;margin-top:6px}
.dbar i{display:block;height:100%;border-radius:4px}
.mono-sm{font-size:10.5px;color:var(--mut);word-break:break-word}
.caveat{border-left:2px solid var(--cin);padding:9px 0 9px 13px;margin-top:16px;
  color:var(--mut);font-size:11px;line-height:1.7;max-width:78ch}

</style>

<div id="orbs"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>
<canvas id="cv"></canvas>

<header class="hud">
  <h1>Connector <em>Atlas</em><span class="v">v5</span></h1>
  <div class="stat" id="stat"></div>
</header>

<div class="ctl">
  <input id="q" placeholder="search 821 connectors…" autocomplete="off" spellcheck="false" size="18">
  <input id="pa" placeholder="from…" size="9"><input id="pb" placeholder="to…" size="9">
  <button id="go">path</button>
  <button id="mode" title="direct = only real edges; bridge = build the edge">bridge</button>
  <button id="edges" class="on" title="show derived archetype edges">edges</button>
  <button id="labbtn" title="pairs, motifs, model diff">lab</button>
</div>

<aside id="rail">
  <div class="tabs">
    <button id="tA" class="on">archetypes</button>
    <button id="tS">examples</button>
  </div>
  <div class="rows" id="rows"></div>
</aside>

<aside id="detail"></aside>
<div id="pathout"></div>


<div id="lab" role="dialog" aria-modal="true" aria-label="combinatorial views">
  <button class="labx" id="labx" aria-label="close">×</button>
  <h2>the <em>combination space</em></h2>
  <div class="sub" id="labsub"></div>
  <div class="labtabs" role="tablist">
    <button data-v="P" class="on">pair explorer</button>
    <button data-v="C">connector profile</button>
    <button data-v="M">motif census</button>
    <button data-v="D">model diff</button>
    <button data-v="S">schema evidence</button>
  </div>
  <div class="lv on" id="lvP"></div>
  <div class="lv" id="lvC"></div>
  <div class="lv" id="lvM"></div>
  <div class="lv" id="lvD"></div>
  <div class="lv" id="lvS"></div>
</div>
<div id="sfx">
  <span class="sfc"><i style="background:#35A481"></i>read</span>
  <span class="sfc"><i style="background:#C9B458"></i>create</span>
  <span class="sfc"><i style="background:#E08A3C"></i>mutate</span>
  <span class="sfc"><i style="background:#E64A2E"></i>irreversible</span>
  <span class="sfc"><i style="background:#F4EFE8"></i>verified</span>
</div>
<div id="hint">drag rotate · scroll zoom · click a node · pick a system to see its shape</div>
<div id="zoom">
  <button id="zi">+</button><button id="zo">−</button><button id="zr">⟲</button>
</div>

<script>
(function(){
"use strict";
var D = __DATA__;
var A = D.archetypes, AK = Object.keys(A), C = D.connectors, E = D.edges,
    SYS = D.systems, AN = D.analysis, KC = D.keyColors;
var SIDES = ["read","create","mutate","irreversible"];
var SIDEC = {read:"#35A481",create:"#C9B458",mutate:"#E08A3C",irreversible:"#E64A2E"};
var STRONG = D.strongKeys, PAL = D.palette;
var HUB = D.hubArches, FB = D.fallbackArches;
var N = C.length, aidx = {}; AK.forEach(function(k,i){aidx[k]=i;});

/* ---------- geometry: 47 archetype anchors, each a cluster of its connectors ----------
   A single fibonacci spiral over all 821 nodes puts each archetype in a narrow latitude
   band spanning every longitude, so member-averaged centroids collapse onto the polar
   axis and every edge draws through the middle. Anchoring the archetypes first and
   scattering members in a cap around their own anchor is what makes it a constellation. */
var GA=Math.PI*(3-Math.sqrt(5));
var bx=new Float64Array(N), by=new Float64Array(N), bz=new Float64Array(N);
var cen={}, memberIdx={};
AK.forEach(function(k){memberIdx[k]=[];});
for(var i=0;i<N;i++) memberIdx[C[i].a].push(i);

var NA=AK.length;
AK.forEach(function(k,ai){
  var y=1-2*(ai+0.5)/NA, r=Math.sqrt(Math.max(0,1-y*y)), t=GA*ai;
  cen[k]=[Math.cos(t)*r, y, Math.sin(t)*r];
});
AK.forEach(function(k){
  var A0=cen[k], mem=memberIdx[k], n=mem.length;
  /* orthonormal basis perpendicular to the anchor */
  var up = Math.abs(A0[1])<0.9 ? [0,1,0] : [1,0,0];
  var u=[A0[1]*up[2]-A0[2]*up[1], A0[2]*up[0]-A0[0]*up[2], A0[0]*up[1]-A0[1]*up[0]];
  var um=Math.hypot(u[0],u[1],u[2])||1; u=[u[0]/um,u[1]/um,u[2]/um];
  var v=[A0[1]*u[2]-A0[2]*u[1], A0[2]*u[0]-A0[0]*u[2], A0[0]*u[1]-A0[1]*u[0]];
  var cap = 0.09 + 0.30*Math.sqrt(n/53);
  mem.forEach(function(gi,j){
    var ang=GA*j, rr=cap*Math.sqrt((j+0.5)/n);
    var x=A0[0]+ (u[0]*Math.cos(ang)+v[0]*Math.sin(ang))*rr;
    var y2=A0[1]+ (u[1]*Math.cos(ang)+v[1]*Math.sin(ang))*rr;
    var z=A0[2]+ (u[2]*Math.cos(ang)+v[2]*Math.sin(ang))*rr;
    var m=Math.hypot(x,y2,z)||1;
    bx[gi]=x/m; by[gi]=y2/m; bz[gi]=z/m;
  });
});
/* pull anchors inside the shell so edges arc through the interior */
AK.forEach(function(k){ cen[k]=[cen[k][0]*0.80, cen[k][1]*0.80, cen[k][2]*0.80]; });

var px=new Float64Array(N), py=new Float64Array(N), pz=new Float64Array(N);
var cpx={}, cpy={}, cpz={};
var order=new Array(N); for(i=0;i<N;i++) order[i]=i;

var cv=document.getElementById("cv"), ctx=cv.getContext("2d");
var detail=document.getElementById("detail"), rows=document.getElementById("rows");
var pathout=document.getElementById("pathout");
var st={yaw:0.7,pitch:-0.18,zoom:1,tz:1,hover:-1,sel:-1,hl:null,q:null,sys:null,
        drag:false,moved:0,lx:0,ly:0,mx:-1,my:-1,last:0,anim:null,
        showEdges:true,mode:"bridge",w:1280,h:800,dpr:1,tab:"A"};
/* honour reduced-motion: no ambient drift, no fly-to easing */
var REDUCED = matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

function now(){return (performance&&performance.now)?performance.now():Date.now();}
function resize(){
  st.w=innerWidth; st.h=innerHeight; st.dpr=Math.min(2,devicePixelRatio||1);
  cv.width=Math.round(st.w*st.dpr); cv.height=Math.round(st.h*st.dpr);
  cv.style.width=st.w+"px"; cv.style.height=st.h+"px";
}
resize(); addEventListener("resize",resize);
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

/* ---------- system membership ---------- */
var sysMembers = SYS.map(function(s){
  var set=Object.create(null);
  (s.connectors||[]).forEach(function(n){set[n.toLowerCase()]=1;});
  var arch=Object.create(null);
  (s.archetypes||[]).forEach(function(a){arch[a]=1;});
  return {names:set, arches:arch, byName:(s.connectors||[]).length>0};
});
function inSystem(ci,si){
  var m=sysMembers[si], c=C[ci];
  if(m.byName && m.names[c.n.toLowerCase()]) return 2;      /* named member */
  if(m.arches[c.a]) return 1;                                /* archetype member */
  return 0;
}

/* ---------- rendering ---------- */
function litNode(i){
  var c=C[i];
  if(st.sys!==null) return inSystem(i,st.sys)>0;
  if(st.hl && c.a!==st.hl) return false;
  if(st.q && c.n.toLowerCase().indexOf(st.q)<0) return false;
  return true;
}
function project(){
  var cy=Math.cos(st.yaw), sy=Math.sin(st.yaw), cp=Math.cos(st.pitch), sp=Math.sin(st.pitch);
  var R=Math.min(st.w,st.h)*0.36*st.zoom, ox=st.w/2, oy=st.h/2+10, cam=3.1;
  function pr(x,y,z){
    var x1=x*cy+z*sy, z1=-x*sy+z*cy, y2=y*cp-z1*sp, z2=y*sp+z1*cp;
    var f=cam/(cam-z2);
    return [ox+x1*R*f, oy-y2*R*f, z2];
  }
  for(var i=0;i<N;i++){var p=pr(bx[i],by[i],bz[i]); px[i]=p[0];py[i]=p[1];pz[i]=p[2];}
  AK.forEach(function(k){var c=cen[k],p=pr(c[0],c[1],c[2]); cpx[k]=p[0];cpy[k]=p[1];cpz[k]=p[2];});
}
function drawEdges(){
  if(!st.showEdges) return;
  var sysA = st.sys!==null ? sysMembers[st.sys].arches : null;
  ctx.lineWidth=1;
  for(var e=0;e<E.length;e++){
    var ed=E[e];
    if(ed.h && st.sys===null && !st.hl) continue;            /* hub edges hidden by default */
    var on=true, strong=false;
    if(sysA){ on = sysA[ed.s] && sysA[ed.t]; strong=on; }
    else if(st.hl){ on = (ed.s===st.hl||ed.t===st.hl); strong=on; }
    else if(st.sel>=0){ var sa=C[st.sel].a; on=(ed.s===sa||ed.t===sa); strong=on; }
    var z=(cpz[ed.s]+cpz[ed.t])/2;
    if(z<-0.55) continue;
    var a = strong ? 0.42 : (st.sys!==null||st.hl||st.sel>=0 ? 0.012 : 0.05);
    a *= (0.45+0.55*(z+1)/2);
    if(a<0.006) continue;
    ctx.globalAlpha=a;
    ctx.strokeStyle=KC[ed.k]||"#666";
    var x1=cpx[ed.s],y1=cpy[ed.s],x2=cpx[ed.t],y2=cpy[ed.t];
    var mx=(x1+x2)/2,my=(y1+y2)/2, dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy)||1;
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.quadraticCurveTo(mx-(dy/d)*d*0.14, my+(dx/d)*d*0.14, x2,y2);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function draw(){
  ctx.setTransform(st.dpr,0,0,st.dpr,0,0);
  ctx.clearRect(0,0,st.w,st.h);
  project();
  /* soft core glow */
  var R=Math.min(st.w,st.h)*0.36*st.zoom, ox=st.w/2, oy=st.h/2+10;
  var g=ctx.createRadialGradient(ox,oy,R*0.1,ox,oy,R*1.5);
  g.addColorStop(0,"rgba(230,74,46,.05)"); g.addColorStop(.55,"rgba(53,164,129,.03)");
  g.addColorStop(1,"rgba(14,12,11,0)");
  ctx.fillStyle=g; ctx.fillRect(ox-R*1.6,oy-R*1.6,R*3.2,R*3.2);

  drawEdges();

  order.sort(function(a,b){return pz[a]-pz[b];});
  var filt = (st.q||st.hl||st.sys!==null);
  var zb=Math.min(1.5,0.85+0.3*st.zoom);
  for(var k=0;k<N;k++){
    var i=order[k], c=C[i], t=(pz[i]+1)/2;
    var mem = st.sys!==null ? inSystem(i,st.sys) : 0;
    var rad=(2.0+1.9*t)*zb * (mem===2?1.75:1);
    var al=0.18+0.74*t;
    if(filt && !litNode(i)) al*=0.07;
    else if(mem===2) al=1;
    if(i===st.sel||i===st.hover) al=1;
    ctx.globalAlpha=al;
    ctx.fillStyle = c.v ? "#F4EFE8" : PAL[aidx[c.a]];
    ctx.beginPath(); ctx.arc(px[i],py[i],rad,0,6.2832); ctx.fill();
    if(mem===2 && al>0.5){
      ctx.globalAlpha=0.5; ctx.strokeStyle="#FF6B4A"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(px[i],py[i],rad+3.5,0,6.2832); ctx.stroke();
    }
  }
  ctx.globalAlpha=1;
  archLabels();
  if(st.zoom>=1.7) labels();
  if(st.sel>=0) ring(st.sel,"#F4EFE8",true);
  if(st.hover>=0&&st.hover!==st.sel) ring(st.hover,"rgba(244,239,232,.9)",false);
  if(st.hover>=0) tooltip(st.hover);
}
function archLabels(){
  var sysA = st.sys!==null ? sysMembers[st.sys].arches : null;
  ctx.font="italic 12px Georgia,serif";
  ctx.textAlign="center";
  var ks=AK.slice().sort(function(a,b){return cpz[a]-cpz[b];});
  for(var j=0;j<ks.length;j++){
    var k=ks[j];
    if(cpz[k]<0.02) continue;
    var on = sysA ? !!sysA[k] : (st.hl ? st.hl===k : true);
    var a = (cpz[k]*0.55+0.2) * (on?1:0.16);
    if(st.zoom>=1.7 && !sysA && !st.hl) a*=0.45;
    if(a<0.04) continue;
    ctx.globalAlpha=a;
    ctx.fillStyle = on&&(sysA||st.hl) ? "#F4EFE8" : PAL[aidx[k]];
    ctx.fillText(A[k].label, cpx[k], cpy[k]-6);
  }
  ctx.globalAlpha=1; ctx.textAlign="left";
}
function ring(i,col,sel){
  ctx.beginPath(); ctx.strokeStyle=col; ctx.lineWidth=1.4;
  ctx.arc(px[i],py[i],7,0,6.2832); ctx.stroke();
  if(sel){ctx.beginPath();ctx.strokeStyle="rgba(230,74,46,.85)";ctx.lineWidth=1.1;
    ctx.arc(px[i],py[i],10.5,0,6.2832);ctx.stroke();}
}
function labels(){
  var boxes=[], idx=[];
  ctx.font="9.5px "+"ui-monospace,monospace";
  for(var i=0;i<N;i++) if(pz[i]>0.12) idx.push(i);
  idx.sort(function(a,b){return pz[b]-pz[a];});
  for(var k=0;k<idx.length&&boxes.length<90;k++){
    var i=idx[k];
    if((st.q||st.hl||st.sys!==null)&&!litNode(i)) continue;
    if(i===st.hover) continue;
    var x=px[i]+7,y=py[i]+3,w=C[i].n.length*5.3+6;
    if(x+w>st.w-6||y<12||y>st.h-6) continue;
    var ok=true;
    for(var b=0;b<boxes.length;b++){var q=boxes[b];
      if(x<q[0]+q[2]&&x+w>q[0]&&y-9<q[1]+q[3]&&y>q[1]){ok=false;break;}}
    if(!ok) continue;
    boxes.push([x,y-9,w,12]);
    ctx.globalAlpha=Math.min(1,.35+pz[i]*.6);
    ctx.fillStyle="rgba(244,239,232,.82)";
    ctx.fillText(C[i].n,x,y);
  }
  ctx.globalAlpha=1;
}
function tooltip(i){
  var c=C[i], x=px[i],y=py[i];
  ctx.font="12px ui-monospace,monospace";
  var w1=ctx.measureText(c.n).width;
  var lab=A[c.a].label;
  ctx.font="italic 12.5px Georgia,serif";
  var w2=ctx.measureText(lab).width;
  var w=Math.max(w1,w2)+20, h=42;
  var bx2=x+15; if(bx2+w>st.w-10) bx2=x-15-w;
  var by2=Math.max(8,Math.min(st.h-h-8,y-h/2));
  ctx.fillStyle="rgba(14,12,11,.9)"; ctx.fillRect(bx2,by2,w,h);
  ctx.strokeStyle="rgba(244,239,232,.2)"; ctx.lineWidth=1;
  ctx.strokeRect(bx2+.5,by2+.5,w-1,h-1);
  ctx.fillStyle="#F4EFE8"; ctx.font="12px ui-monospace,monospace";
  ctx.fillText(c.n,bx2+10,by2+17);
  ctx.fillStyle=PAL[aidx[c.a]]; ctx.font="italic 12.5px Georgia,serif";
  ctx.fillText(lab,bx2+10,by2+33);
}
function pick(mx,my){
  var best=-1,bd=110;
  for(var i=0;i<N;i++){
    if(pz[i]<=0) continue;
    var dx=px[i]-mx,dy=py[i]-my,d=dx*dx+dy*dy;
    if(d<bd){bd=d;best=i;}
  }
  return best;
}

/* ---------- pathfinding (mirrors engine/graph.py + skill atlas.py) ---------- */
var adj={};
E.forEach(function(e){ (adj[e.s]=adj[e.s]||{})[e.t]=e.keys; });
function wt(n){ return HUB.indexOf(n)>=0?3:(FB.indexOf(n)>=0?2:1); }
function paths(s,t,k){
  var found=[],seen={},pq=[[0,[s]]];
  while(pq.length&&found.length<k){
    pq.sort(function(a,b){return a[0]-b[0];});
    var it=pq.shift(), cost=it[0], p=it[1], u=p[p.length-1];
    if(u===t){ var key=p.join(">"); if(!seen[key]){seen[key]=1;found.push([cost,p]);} continue; }
    if(p.length>5) continue;
    for(var v in (adj[u]||{})){ if(p.indexOf(v)>=0) continue; pq.push([cost+wt(v),p.concat([v])]); }
  }
  return found;
}
function findConn(q){
  q=q.toLowerCase().trim(); if(!q) return null;
  for(var i=0;i<N;i++) if(C[i].n.toLowerCase()===q) return C[i];
  var m=null;
  for(i=0;i<N;i++) if(C[i].n.toLowerCase().indexOf(q)>=0)
    if(!m||C[i].n.length<m.n.length) m=C[i];
  return m;
}
function members(a,ex,n){
  var r=[];
  for(var i=0;i<N;i++) if(C[i].a===a && C[i].n!==ex) r.push(C[i]);
  r.sort(function(x,y){return (x.p||999)-(y.p||999)||x.n.localeCompare(y.n);});
  return r.slice(0,n||3).map(function(c){return c.n;});
}
function runPath(){
  var a=findConn(document.getElementById("pa").value),
      b=findConn(document.getElementById("pb").value);
  pathout.style.display="block";
  if(!a||!b){ pathout.innerHTML='<span class="warn2">name not found in the 821-connector registry.</span>'; return; }
  var ke=(adj[a.a]&&adj[a.a][b.a])||null;
  var h='<b>'+esc(a.n)+'</b> ['+a.a+'] → <b>'+esc(b.n)+'</b> ['+b.a+']<br>';
  if(ke){
    h+='MODE: <span class="hop">direct</span> · JOIN KEYS: <span class="key">'+ke.join(", ")+
       '</span> · CONFIDENCE: '+ (a.cf==="VERIFIED"&&b.cf==="VERIFIED" ? "VERIFIED" : "weakest of "+a.cf+"/"+b.cf);
  } else if(st.mode==="direct"){
    h+='MODE: <span class="hop">direct</span> — <span class="warn2">no direct edge.</span><br>'+
       esc(a.n)+' emits: '+(A[a.a].emits.join(", "))+'<br>'+
       esc(b.n)+' consumes: '+(A[b.a].consumes.join(", "))+'<br>'+
       '<span class="warn2">Honest stop. Switch to bridge mode to build the edge.</span>';
  } else {
    var ps=paths(a.a,b.a,3);
    h+='MODE: <span class="hop">bridge</span> — no direct edge; building it:<br>';
    if(!ps.length) h+='<span class="warn2">unreachable even via hubs under current profiles.</span>';
    ps.forEach(function(pp){
      var cost=pp[0],p=pp[1],segs="";
      for(var i2=0;i2<p.length-1;i2++)
        segs+=' —<span class="key">'+(adj[p[i2]][p[i2+1]]||[]).slice(0,2).join("/")+'</span>→ <span class="hop">'+p[i2+1]+'</span>';
      h+='<br>[cost '+cost+'] <span class="hop">'+p[0]+'</span>'+segs;
      for(var j=1;j<p.length-1;j++){
        var tagx = HUB.indexOf(p[j])>=0?" (hub — new account, new auth surface)":
                   (FB.indexOf(p[j])>=0?" (fallback — brittle)":"");
        h+='<br>&nbsp;&nbsp;&nbsp;&nbsp;'+p[j]+tagx+': e.g. '+members(p[j],null,3).join(", ");
      }
    });
    h+='<br><span class="warn2">PRICE: each third-party bridge hop = +1 account, +1 auth surface, −visibility.</span>';
  }
  pathout.innerHTML=h;
}

/* ---------- panels ---------- */
function bar(label,val,col){
  return '<div class="bar"><div class="lb"><span>'+esc(label)+'</span><b>'+val+'</b></div>'+
    '<div class="tr"><div class="fl" style="width:'+Math.max(0,Math.min(100,val))+'%;background:'+col+'"></div></div></div>';
}
function openConn(i){
  st.sel=i; st.sys=null; st.last=now();
  var c=C[i], a=A[c.a];
  var joins=[];
  AK.forEach(function(b){
    if(b===c.a) return;
    var ke=(adj[c.a]&&adj[c.a][b]);
    if(ke && ke.length) joins.push([b,ke]);
  });
  var h='<button class="dx" id="dx">×</button><div class="dk">connector</div><h2>'+esc(c.n)+'</h2>'+
    '<p class="tag">'+esc(c.r)+'</p><div class="chips">'+
    '<span class="chip" style="color:'+SIDEC[c.s]+';border-color:'+SIDEC[c.s]+'66">'+c.s+'</span>'+
    '<span class="chip" style="color:'+PAL[aidx[c.a]]+';border-color:'+PAL[aidx[c.a]]+'66">'+esc(a.label)+'</span>'+
    '<span class="chip" style="'+(c.v?'color:#F4EFE8;border-color:rgba(244,239,232,.5)':'')+'">'+c.cf.toLowerCase()+'</span>'+
    '</div>';
  if(c.v && c.vb){
    h+='<div class="sec">verified capability</div>';
    if(c.vb.verbs) h+='<div class="chips">'+c.vb.verbs.slice(0,18).map(function(v){
      return '<span class="chip">'+esc(v)+'</span>';}).join("")+'</div>';
    if(c.vb.dead_ends && c.vb.dead_ends.length)
      h+='<div class="warn"><b>dead ends observed</b><br>· '+
         c.vb.dead_ends.map(esc).join("<br>· ")+'</div>';
  }
  var ce=(c.e&&c.e.length)?c.e:[], cc=(c.cn&&c.cn.length)?c.cn:[];
  h+='<div class="sec">emits · '+c.ti.toLowerCase()+'</div><div class="chips">'+
     (ce.length?ce.map(function(k){return '<span class="chip em">'+k+'</span>';}).join(""):'<span class="none">—</span>')+'</div>';
  h+='<div class="sec">consumes · '+c.ti.toLowerCase()+'</div><div class="chips">'+
     (cc.length?cc.map(function(k){return '<span class="chip co">'+k+'</span>';}).join(""):'<span class="none">— no write tools, so nothing can point in</span>')+'</div>';
  if(c.tl && c.tl.length){
    h+='<div class="sec">real tools'+(c.tt?' · +'+c.tt+' hidden':'')+'</div><div class="chips">'+
       c.tl.slice(0,10).map(function(t){return '<span class="chip">'+esc(t)+'</span>';}).join("")+'</div>';
  }
  h+='<div class="sec">joins to · strong keys</div><div class="chips">';
  h+= joins.length? joins.map(function(j){
        return '<span class="chip" title="via '+j[1].join(", ")+'"><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:'+
          PAL[aidx[j[0]]]+';margin-right:5px"></i>'+esc(A[j[0]].label)+'</span>';}).join("")
      : '<span class="none">no strong-key joins — a pure source or a pure sink</span>';
  h+='</div>';
  var inSys=[];
  SYS.forEach(function(s,si){ if(inSystem(i,si)===2) inSys.push(s.name); });
  if(inSys.length) h+='<div class="sec">appears in</div><div class="chips">'+
    inSys.map(function(n){return '<span class="chip">'+esc(n)+'</span>';}).join("")+'</div>';
  if(a.note) h+='<div class="note">'+esc(a.note)+'</div>';
  detail.innerHTML=h; detail.classList.add("open"); wireClose();
  draw();
}

/* ================= lab: pairs, profiles, motifs, model diff =================
   All four views read precomputed data. The pair matrix is class-compressed --
   classOf maps a connector to its profile class, matrix[i][j] is the hop
   distance -- so any of the 673,220 ordered pairs resolves in two lookups with

var LAB=document.getElementById("lab"), PAIRS=D.pairs, MOT=D.motifs,
    TRI=D.triples, DIFF=D.diff, QQ=D.questions;
var byName={}; C.forEach(function(c,i){ byName[c.n.toLowerCase()]=i; });
function fmt(n){ return (n==null)?"—":n.toLocaleString("en-US"); }
function findName(q){
  q=(q||"").trim().toLowerCase(); if(!q) return -1;
  if(byName[q]!=null) return byName[q];
  var best=-1,bl=1e9;
  for(var i=0;i<C.length;i++){ var n=C[i].n.toLowerCase();
    if(n.indexOf(q)>=0 && n.length<bl){best=i;bl=n.length;} }
  return best;
}

      var r=d.reachability[rg][m];
      h+='<tr><td>'+(m==="inherited"?esc(rg.replace(/_/g," ")):"")+'</td><td>'+m+
         '</td><td class="num">'+r.pct_direct.toFixed(2)+'%</td><td class="num">'+
         r.pct_within_2.toFixed(2)+'%</td><td class="num">'+fmt(r.unreachable)+
         '</td><td class="num">'+r.diameter+'</td></tr>';
    });
  });
  h+='</table></div>';
  h+='<h2 style="font-size:22px;margin-top:30px">connectors that lost <em>every</em> inbound edge</h2>'+
     '<div class="sub">'+esc(d.connectors_that_now_consume_nothing.meaning)+'</div>'+
     '<div class="chips" style="margin-top:11px">'+
     d.connectors_that_now_consume_nothing.sample.map(function(n){
       return '<span class="chip">'+esc(n)+'</span>';}).join("")+
     '<span class="chip" style="color:var(--mut)">&hellip; '+
     (d.connectors_that_now_consume_nothing.count-d.connectors_that_now_consume_nothing.sample.length)+
     ' more</span></div>';
  h+='<div class="caveat">'+d.connectors_compared+' connectors compared. '+
     'The harvested model is not simply better everywhere: '+
     (821-453-11)+' connectors were never returned by the registry search and still carry their '+
     'archetype profile, so part of this graph is still inherited. Those rows are tagged '+
     'DIRECTORY and are excluded from any claim that rests on tool evidence.</div>';
  document.getElementById("lvD").innerHTML=h;
}


/* ---------- lab view 5: parameter schemas, and what names cost -------------
   The other four views describe a graph built from tool NAMES. This one is the
   audit of that graph against tool PARAMETERS, on the 11 connectors where both
   exist. It is deliberately the smallest view and the only one that reports an
   error rate for the method the other four rely on. */
function renderSchema(){
  var d=D.schema, el=document.getElementById("lvS");
  if(!d){
    el.innerHTML='<h2>parameter <em>schemas</em></h2><div class="sub">Not computed for '+
      'this build. Run <code>python3 engine/schema.py --derive --delta</code> and re-render. '+
      'An empty table here would read as a finding; it is a missing measurement.</div>';
    return;
  }
  var a=d.agreement, tot=a.both+a.names_only+a.params_only;
  var h='<h2>what a name <em>costs</em></h2>'+
    '<div class="sub">ToolSearch returns the full JSONSchema for every tool this session can '+
    'reach. Parameters give <b>consumes</b> directly, where names only approximate it, so the '+
    '11 session connectors can be used to price the name-based derivation carrying the other '+
    '453. Parameters are the reference; names are the estimate. This is a depth upgrade for '+
    'eleven connectors and a sharper test for the rest &mdash; it is not, and cannot be turned '+
    'into, coverage.</div>';

  h+='<div class="mgrid" style="margin-top:20px">'+
     '<div class="mcard"><div class="k">precision</div><div class="v">'+
     (a.precision*100).toFixed(1)+'%</div><div class="d">when a name claims a key, it is '+
     'usually right</div></div>'+
     '<div class="mcard"><div class="k">recall</div><div class="v">'+
     (a.recall*100).toFixed(1)+'%</div><div class="d">but it sees well under half of what '+
     'the parameters actually accept</div></div>'+
     '<div class="mcard"><div class="k">keys invented</div><div class="v">'+a.names_only+
     '</div><div class="d">of '+tot+' claims &mdash; edges drawn into a parameter that does '+
     'not exist</div></div>'+
     '<div class="mcard"><div class="k">keys missed</div><div class="v">'+a.params_only+
     '</div><div class="d">real inbound edges the name model never drew</div></div>'+
     '</div>';

  h+='<div class="caveat" style="margin-top:14px">Only <b>consumes</b> is upgraded here. MCP '+
     'tool schemas describe inputs; there is no output schema, so <b>emits</b> stays '+
     'name-derived everywhere in this atlas, including on these eleven. Side-effect class '+
     'agrees on '+d.sideEffects.agree+' of '+(d.sideEffects.agree+d.sideEffects.differ)+'.</div>';

  h+='<h2 style="font-size:22px;margin-top:30px">per connector</h2>'+
     '<div class="scroll"><table class="ltab"><tr><th>connector</th><th>tools</th><th>params</th>'+
     '<th>names said</th><th>parameters say</th><th>invented</th><th>missed</th></tr>';
  Object.keys(d.connectors).sort().forEach(function(n){
    var r=d.connectors[n], p=d.profiles[n]||{};
    h+='<tr><td>'+esc(n)+'</td><td class="num">'+(p.nTools||0)+'</td>'+
       '<td class="num">'+(p.nParams||0)+'</td>'+
       '<td>'+(r.name_derived.join(", ")||"&mdash;")+'</td>'+
       '<td>'+(r.param_derived.join(", ")||"&mdash;")+'</td>'+
       '<td style="color:#E64A2E">'+(r.invented.join(", ")||"&mdash;")+'</td>'+
       '<td style="color:#35A481">'+(r.missed.join(", ")||"&mdash;")+'</td></tr>';
  });
  h+='</table></div>';

  h+='<h2 style="font-size:22px;margin-top:30px">selectors &mdash; what a read can be '+
     '<em>addressed by</em></h2>'+
     '<div class="sub">New in Phase 3 and with no name-level equivalent. A connector whose '+
     'reads accept only its own opaque ids cannot be entered from outside without already '+
     'holding one, which is a join constraint the edge model never expressed.</div>'+
     '<div class="scroll"><table class="ltab"><tr><th>connector</th><th>addressable by</th>'+
     '<th>runtime</th></tr>';
  Object.keys(d.selectors).sort().forEach(function(n){
    var sel=d.selectors[n], rt=(d.runtime[n]||{}).schema||"&mdash;";
    h+='<tr><td>'+esc(n)+'</td><td>'+(sel.join(", ")||
       '<span style="color:#E64A2E">nothing &mdash; no read tool takes a typed key</span>')+
       '</td><td'+(rt==="poll_blind"?' style="color:#E64A2E"':'')+'>'+esc(rt)+'</td></tr>';
  });
  h+='</table></div>';

  h+='<h2 style="font-size:22px;margin-top:30px">preconditions &mdash; tools that '+
     '<em>cannot be called first</em></h2>'+
     '<div class="sub">Mandatory ordering inside a single connector, stated in the schema and '+
     'invisible in a tool name. Two vendors independently guard money this way: nothing can be '+
     'bought on Vercel without a quote, and no Supabase project is created without a cost '+
     'confirmation. Every arrow is a step that must succeed before the system can act.</div>'+
     '<div class="scroll"><table class="ltab"><tr><th>connector</th><th>must run first</th>'+
     '<th>before</th></tr>';
  Object.keys(d.preconditions).sort().forEach(function(n){
    d.preconditions[n].forEach(function(pr,i){
      h+='<tr><td>'+(i===0?esc(n):"")+'</td><td>'+esc(pr[0])+'</td><td>'+esc(pr[1])+'</td></tr>';
    });
  });
  h+='</table></div>';

  h+='<div class="caveat" style="margin-top:18px">11 of 820 connectors, which is 1.3%. '+
     'ToolSearch can only see connectors this session is connected to, and connecting 800 is '+
     'not something a session can do. Phase 2&rsquo;s 58% registry-harvest ceiling is a '+
     'different limit on a different axis and is neither affected nor beaten by any of this.</div>';
  el.innerHTML=h;
}

var labBuilt=false;
function openLab(){
  if(!labBuilt){ labsub(); renderPairs(); renderProf(); renderMot(); renderDiff();
                 renderSchema(); labBuilt=true; }
  LAB.classList.add("open");
}
document.getElementById("labbtn").onclick=openLab;
document.getElementById("labx").onclick=function(){ LAB.classList.remove("open"); };
Array.prototype.forEach.call(LAB.querySelectorAll(".labtabs button"),function(b){
  b.onclick=function(){
    Array.prototype.forEach.call(LAB.querySelectorAll(".labtabs button"),function(x){
      x.classList.remove("on"); });
    b.classList.add("on");
    Array.prototype.forEach.call(LAB.querySelectorAll(".lv"),function(v){ v.classList.remove("on"); });
    document.getElementById("lv"+b.dataset.v).classList.add("on");
  };
});

(function frame(){
  var t=now(), dt=Math.min(50,t-lastT); lastT=t;
  if(st.anim){
    var a2=st.anim,u=Math.min(1,(t-a2.t0)/a2.dur);
    var ez=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
    st.yaw=a2.y0+a2.dy*ez; st.pitch=a2.p0+a2.dp*ez;
    if(u>=1){st.anim=null;st.last=now();}
  } else if(!REDUCED&&!st.drag&&st.hover<0&&t-st.last>2600){ st.yaw+=0.00009*dt; }
  st.zoom+=(st.tz-st.zoom)*Math.min(1,dt*0.012);
  if(!st.drag&&st.mx>=0){
    st.hover=pick(st.mx,st.my);
    cv.classList.toggle("pointing",st.hover>=0);
    if(st.hover>=0) st.last=now();
  }
  draw();
  requestAnimationFrame(frame);
})();
})();
</script>
